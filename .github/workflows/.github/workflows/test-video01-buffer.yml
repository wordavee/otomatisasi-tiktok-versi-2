name: Wordivee 24H Buffer Scheduler

on:
  workflow_dispatch:
    inputs:
      session:
        description: "Sesi yang diuji/jalankan"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - "1"
          - "2"
          - "3"
      target_date:
        description: "Tanggal posting WIB, YYYY-MM-DD. Kosong = hari ini"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Tes saja: jangan membuat post Buffer dan jangan cleanup"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "30 0 * * *"
      timezone: "Asia/Jakarta"
    - cron: "30 10 * * *"
      timezone: "Asia/Jakarta"
    - cron: "30 20 * * *"
      timezone: "Asia/Jakarta"

permissions:
  contents: write

concurrency:
  group: wordivee-buffer-publisher
  cancel-in-progress: false

jobs:
  schedule-wordivee:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.WORDIVEE_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      EVENT_NAME: ${{ github.event_name }}
      SCHEDULE_EXPR: ${{ github.event.schedule }}
      INPUT_SESSION: ${{ inputs.session }}
      INPUT_TARGET_DATE: ${{ inputs.target_date }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      EXPORT_ASSET_FOLDER: wordavee/exports
      MAX_EXPORT_AGE_HOURS: "30"
      EXPORT_RETENTION_DAYS: "3"
      QUOTE_GUARD_START_DATE: "2026-09-11"
      QUOTE_SIMILARITY_THRESHOLD: "0.94"
      QUOTE_HISTORY_FILE: "quotes-history.json"

    steps:
      - name: Checkout repository for quote history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preflight, quote guard, schedule Buffer, and cleanup Cloudinary
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import base64
          import hashlib
          import unicodedata
          import urllib.parse
          import urllib.request
          import urllib.error
          from datetime import datetime, timedelta, timezone, date
          from zoneinfo import ZoneInfo

          WIB = ZoneInfo("Asia/Jakarta")
          UTC = timezone.utc

          cloud_name = os.environ["CLOUDINARY_CLOUD_NAME"]
          cloud_key = os.environ["CLOUDINARY_API_KEY"]
          cloud_secret = os.environ["CLOUDINARY_API_SECRET"]
          buffer_key = os.environ["BUFFER_API_KEY"]
          channel_id = os.environ["BUFFER_CHANNEL_ID"]
          asset_folder = os.environ.get("EXPORT_ASSET_FOLDER", "wordavee/exports")
          max_age_hours = float(os.environ.get("MAX_EXPORT_AGE_HOURS", "30"))
          retention_days = float(os.environ.get("EXPORT_RETENTION_DAYS", "3"))
          guard_start = date.fromisoformat(os.environ.get("QUOTE_GUARD_START_DATE", "2026-09-11"))
          similarity_threshold = float(os.environ.get("QUOTE_SIMILARITY_THRESHOLD", "0.94"))
          history_file = os.environ.get("QUOTE_HISTORY_FILE", "quotes-history.json")

          event_name = os.environ.get("EVENT_NAME", "")
          schedule_expr = os.environ.get("SCHEDULE_EXPR", "")
          input_session = (os.environ.get("INPUT_SESSION") or "auto").strip()
          target_date_raw = (os.environ.get("INPUT_TARGET_DATE") or "").strip()
          input_dry = (os.environ.get("INPUT_DRY_RUN") or "").strip().lower()
          dry_run = event_name == "workflow_dispatch" and input_dry in {"true", "1", "yes", "on"}

          now_utc = datetime.now(UTC)
          now_wib = now_utc.astimezone(WIB)

          def fail(message):
              raise SystemExit("ERROR: " + message)

          def parse_iso(value):
              if not value:
                  return None
              value = value.replace("Z", "+00:00")
              dt = datetime.fromisoformat(value)
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=UTC)
              return dt.astimezone(UTC)

          def normalize_quote(value):
              value = unicodedata.normalize("NFKD", str(value or ""))
              value = "".join(ch for ch in value if not unicodedata.combining(ch)).lower()
              value = re.sub(r"[^\w\s]", " ", value, flags=re.UNICODE)
              value = re.sub(r"_", " ", value)
              return re.sub(r"\s+", " ", value).strip()

          def dice_similarity(a, b):
              a = normalize_quote(a).replace(" ", "")
              b = normalize_quote(b).replace(" ", "")
              if not a or not b:
                  return 0.0
              if a == b:
                  return 1.0
              if len(a) < 2 or len(b) < 2:
                  return 0.0
              counts = {}
              for i in range(len(a) - 1):
                  bg = a[i:i+2]
                  counts[bg] = counts.get(bg, 0) + 1
              overlap = 0
              for i in range(len(b) - 1):
                  bg = b[i:i+2]
                  n = counts.get(bg, 0)
                  if n > 0:
                      overlap += 1
                      counts[bg] = n - 1
              return 2.0 * overlap / ((len(a) - 1) + (len(b) - 1))

          def quote_hash(normalized):
              return hashlib.sha256(normalized.encode("utf-8")).hexdigest()

          def decode_context_value(value):
              return urllib.parse.unquote(str(value or ""))

          def load_history():
              try:
                  with open(history_file, "r", encoding="utf-8") as f:
                      data = json.load(f)
                  if not isinstance(data, dict):
                      raise ValueError("history bukan object")
                  if not isinstance(data.get("quotes"), list):
                      data["quotes"] = []
                  data.setdefault("version", 1)
                  data.setdefault("updated_at", None)
                  return data
              except FileNotFoundError:
                  return {"version": 1, "updated_at": None, "quotes": []}
              except Exception as exc:
                  fail(f"quotes-history.json tidak valid: {exc}")

          def basic_auth():
              token = base64.b64encode(f"{cloud_key}:{cloud_secret}".encode()).decode()
              return {"Authorization": f"Basic {token}"}

          def http_json(url, *, method="GET", headers=None, data=None, timeout=45):
              req = urllib.request.Request(url, method=method, headers=headers or {}, data=data)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      raw = response.read()
                      return json.loads(raw.decode("utf-8")) if raw else {}
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  fail(f"HTTP {exc.code} untuk {url}: {body[:1200]}")
              except urllib.error.URLError as exc:
                  fail(f"Tidak dapat mengakses {url}: {exc}")

          def buffer_graphql(query):
              payload = json.dumps({"query": query}).encode("utf-8")
              data = http_json(
                  "https://api.buffer.com",
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {buffer_key}",
                      "Content-Type": "application/json",
                  },
                  data=payload,
              )
              if data.get("errors"):
                  fail("Buffer GraphQL: " + json.dumps(data["errors"], ensure_ascii=False))
              return data.get("data") or {}

          # Resolve session.
          schedule_map = {
              "30 0 * * *": "1",
              "30 10 * * *": "2",
              "30 20 * * *": "3",
          }
          if event_name == "schedule":
              session = schedule_map.get(schedule_expr)
              if not session:
                  # Defensive fallback if GitHub changes event.schedule formatting.
                  if now_wib.hour < 6:
                      session = "1"
                  elif now_wib.hour < 16:
                      session = "2"
                  else:
                      session = "3"
          else:
              session = input_session
              if session == "auto":
                  if now_wib.hour < 6:
                      session = "1"
                  elif now_wib.hour < 16:
                      session = "2"
                  else:
                      session = "3"

          if session not in {"1", "2", "3"}:
              fail(f"Session tidak valid: {session}")

          slot_map = {
              "1": list(range(1, 11)),
              "2": list(range(11, 21)),
              "3": list(range(21, 25)),
          }
          slots = slot_map[session]

          if target_date_raw:
              try:
                  target_day = date.fromisoformat(target_date_raw)
              except ValueError:
                  fail("target_date harus YYYY-MM-DD")
          else:
              target_day = now_wib.date()

          quote_guard_active = target_day >= guard_start

          def slot_due_wib(slot):
              if slot == 24:
                  next_day = target_day + timedelta(days=1)
                  return datetime(next_day.year, next_day.month, next_day.day, 0, 0, tzinfo=WIB)
              return datetime(target_day.year, target_day.month, target_day.day, slot, 0, tzinfo=WIB)

          due_by_slot = {slot: slot_due_wib(slot) for slot in slots}
          past = [slot for slot, due in due_by_slot.items() if due.astimezone(UTC) <= now_utc + timedelta(minutes=3)]
          if past and not dry_run:
              fail(f"Waktu slot sudah lewat/terlalu dekat: {past}. target_date={target_day}")

          print(f"WIB sekarang       : {now_wib.isoformat()}")
          print(f"Session            : {session}")
          print(f"Target tanggal WIB : {target_day}")
          print(f"Dry run            : {dry_run}")
          print(f"Quote guard        : {'AKTIF' if quote_guard_active else 'LEGACY (mulai ' + guard_start.isoformat() + ')'}")
          print(f"Slots              : {slots}")

          # Fetch all assets directly in the exports asset folder (pagination supported).
          resources = []
          cursor = None
          while True:
              params = {"asset_folder": asset_folder, "max_results": 500}
              if cursor:
                  params["next_cursor"] = cursor
              url = (
                  f"https://api.cloudinary.com/v1_1/{cloud_name}/resources/by_asset_folder?"
                  + urllib.parse.urlencode(params)
              )
              page = http_json(url, headers=basic_auth())
              resources.extend(page.get("resources") or [])
              cursor = page.get("next_cursor")
              if not cursor:
                  break

          print(f"Cloudinary assets  : {len(resources)} di {asset_folder}")

          # Cleanup only the exports folder and only when this is a real run.
          if not dry_run:
              cutoff = now_utc - timedelta(days=retention_days)
              old_video_public_ids = []
              for asset in resources:
                  created = parse_iso(asset.get("created_at"))
                  if not created or created >= cutoff:
                      continue
                  if asset.get("resource_type") == "video" and asset.get("type", "upload") == "upload":
                      public_id = asset.get("public_id")
                      if public_id:
                          old_video_public_ids.append(public_id)

              if old_video_public_ids:
                  delete_url = f"https://api.cloudinary.com/v1_1/{cloud_name}/resources/video/upload"
                  for i in range(0, len(old_video_public_ids), 100):
                      chunk = old_video_public_ids[i:i+100]
                      form = urllib.parse.urlencode([("public_ids[]", pid) for pid in chunk]).encode("utf-8")
                      result = http_json(
                          delete_url,
                          method="DELETE",
                          headers={**basic_auth(), "Content-Type": "application/x-www-form-urlencoded"},
                          data=form,
                      )
                      print(f"Cleanup Cloudinary : meminta hapus {len(chunk)} export lama")
              else:
                  print("Cleanup Cloudinary : tidak ada export > 3 hari")

          # Pick newest export per requested video slot.
          # Only accept exports whose filename date matches target_date.
          # This prevents yesterday's MP4/quote from being reused on a new day.
          pattern = re.compile(r"^wordivee-video(\d{2})-(\d{4}-\d{2}-\d{2})(?:_|$)")
          target_day_str = target_day.isoformat()
          candidates = {slot: [] for slot in slots}
          for asset in resources:
              name = (
                  asset.get("display_name")
                  or asset.get("filename")
                  or asset.get("original_filename")
                  or ""
              ).lower()
              m = pattern.match(name)
              if not m:
                  continue
              slot = int(m.group(1))
              export_day = m.group(2)
              if export_day != target_day_str:
                  continue
              if slot in candidates:
                  candidates[slot].append(asset)

          chosen = {}
          preflight_errors = []
          for slot in slots:
              items = candidates[slot]
              items.sort(key=lambda a: a.get("created_at", ""), reverse=True)
              if not items:
                  preflight_errors.append(f"Video{slot:02d}: export tanggal {target_day_str} tidak ditemukan")
                  continue
              asset = items[0]
              created = parse_iso(asset.get("created_at"))
              secure_url = asset.get("secure_url")
              if not created:
                  preflight_errors.append(f"Video{slot:02d}: created_at kosong")
                  continue
              age_hours = (now_utc - created).total_seconds() / 3600
              if age_hours > max_age_hours:
                  preflight_errors.append(
                      f"Video{slot:02d}: export terbaru sudah {age_hours:.1f} jam (maks {max_age_hours:g} jam)"
                  )
                  continue
              if not secure_url:
                  preflight_errors.append(f"Video{slot:02d}: secure_url kosong")
                  continue
              chosen[slot] = asset
              label = asset.get("display_name") or asset.get("public_id")
              print(f"Video{slot:02d}          : {label} | umur {age_hours:.1f} jam")

          if preflight_errors:
              print("\nPRECHECK GAGAL — tidak ada post Buffer yang dibuat:")
              for err in preflight_errors:
                  print(" -", err)
              fail("Lengkapi export terbaru untuk semua slot sesi ini.")

          # v38+: retrieve contextual metadata for the chosen Cloudinary assets.
          # Cloudinary returns context under context.custom.*.
          if quote_guard_active:
              asset_ids = [chosen[slot].get("asset_id") for slot in slots]
              if any(not x for x in asset_ids):
                  fail("Ada export tanpa asset_id; quote guard tidak dapat diverifikasi.")
              query_pairs = [("asset_ids[]", aid) for aid in asset_ids]
              query_pairs.append(("context", "true"))
              details_url = (
                  f"https://api.cloudinary.com/v1_1/{cloud_name}/resources/by_asset_ids?"
                  + urllib.parse.urlencode(query_pairs)
              )
              detail_data = http_json(details_url, headers=basic_auth())
              detail_by_id = {x.get("asset_id"): x for x in (detail_data.get("resources") or [])}
          else:
              detail_by_id = {}

          history = load_history()
          historical = history.get("quotes") or []
          historical_hashes = {str(x.get("hash") or "") for x in historical if x.get("hash")}
          quote_meta = {}
          quote_errors = []
          batch_hashes = set()
          batch_norms = []

          if quote_guard_active:
              for slot in slots:
                  asset = chosen[slot]
                  details = detail_by_id.get(asset.get("asset_id")) or {}
                  custom = ((details.get("context") or {}).get("custom") or {})
                  quote_text = decode_context_value(custom.get("quote"))
                  normalized = decode_context_value(custom.get("quote_normalized")) or normalize_quote(quote_text)
                  supplied_hash = str(custom.get("quote_hash") or "").strip().lower()
                  qhash = supplied_hash or (quote_hash(normalized) if normalized else "")
                  ctx_date = str(custom.get("posting_date") or "")
                  ctx_slot = str(custom.get("video_slot") or "").zfill(2)

                  if not quote_text or not normalized or not qhash:
                      quote_errors.append(
                          f"Video{slot:02d}: metadata quote tidak ada. Export ulang memakai generator v38+."
                      )
                      continue
                  if ctx_date and ctx_date != target_day_str:
                      quote_errors.append(f"Video{slot:02d}: context posting_date={ctx_date}, seharusnya {target_day_str}")
                      continue
                  if ctx_slot and ctx_slot != f"{slot:02d}":
                      quote_errors.append(f"Video{slot:02d}: context video_slot={ctx_slot} tidak cocok")
                      continue
                  if qhash in historical_hashes:
                      old = next((x for x in historical if x.get("hash") == qhash), {})
                      quote_errors.append(
                          f"Video{slot:02d}: quote SUDAH PERNAH DIPAKAI pada {old.get('date','tanggal lama')}"
                      )
                      continue
                  if qhash in batch_hashes:
                      quote_errors.append(f"Video{slot:02d}: quote duplikat di sesi yang sama")
                      continue

                  # Similarity against central history and this batch.
                  nearest_score = 0.0
                  nearest = None
                  for old in historical:
                      old_norm = old.get("normalized") or normalize_quote(old.get("text"))
                      if not old_norm:
                          continue
                      ratio = min(len(normalized), len(old_norm)) / max(len(normalized), len(old_norm))
                      if len(normalized) >= 18 and len(old_norm) >= 18 and ratio >= 0.72:
                          score = dice_similarity(normalized, old_norm)
                          if score > nearest_score:
                              nearest_score, nearest = score, old
                  for old_slot, old_norm in batch_norms:
                      ratio = min(len(normalized), len(old_norm)) / max(len(normalized), len(old_norm))
                      if len(normalized) >= 18 and len(old_norm) >= 18 and ratio >= 0.72:
                          score = dice_similarity(normalized, old_norm)
                          if score > nearest_score:
                              nearest_score, nearest = score, {"date": target_day_str, "slot": old_slot}
                  if nearest_score >= similarity_threshold:
                      quote_errors.append(
                          f"Video{slot:02d}: quote terlalu mirip ({nearest_score*100:.0f}%) dengan quote {nearest.get('date','lama')} slot {nearest.get('slot','?')}"
                      )
                      continue

                  batch_hashes.add(qhash)
                  batch_norms.append((slot, normalized))
                  quote_meta[slot] = {
                      "text": quote_text,
                      "normalized": normalized,
                      "hash": qhash,
                  }
                  print(f"QUOTE OK Video{slot:02d}: hash={qhash[:12]}…")

              if quote_errors:
                  print("\nQUOTE GUARD GAGAL — tidak ada post Buffer yang dibuat:")
                  for err in quote_errors:
                      print(" -", err)
                  fail("Perbaiki quote/export sebelum menjadwalkan sesi ini.")
          else:
              print(f"Quote guard legacy : dilewati untuk {target_day_str}; jaminan unik mulai {guard_start.isoformat()}.")

          # Locate the Buffer organization that owns this channel.
          account_data = buffer_graphql('''
          query GetOrganizations {
            account { organizations { id name } }
          }
          ''')
          organizations = ((account_data.get("account") or {}).get("organizations") or [])
          if not organizations:
              fail("Buffer tidak mengembalikan organization.")

          org_id = None
          org_name = None
          for org in organizations:
              oid = org.get("id")
              query = f'''
              query GetChannels {{
                channels(input: {{ organizationId: "{oid}" }}) {{
                  id name displayName service
                }}
              }}
              '''
              channels = buffer_graphql(query).get("channels") or []
              if any(ch.get("id") == channel_id for ch in channels):
                  org_id = oid
                  org_name = org.get("name")
                  break
          if not org_id:
              fail("BUFFER_CHANNEL_ID tidak ditemukan di organization Buffer mana pun.")
          print(f"Buffer organization: {org_name} ({org_id})")

          # Free Buffer allows 10 scheduled posts per channel. Require an empty scheduled queue
          # at each fill session so a delayed/old post never causes partial overflow.
          scheduled_query = f'''
          query GetScheduledPosts {{
            posts(
              first: 100
              input: {{
                organizationId: "{org_id}"
                filter: {{ status: [scheduled], channelIds: ["{channel_id}"] }}
                sort: [{{ field: dueAt, direction: asc }}]
              }}
            ) {{
              edges {{ node {{ id dueAt channelId status }} }}
            }}
          }}
          '''
          scheduled_edges = ((buffer_graphql(scheduled_query).get("posts") or {}).get("edges") or [])
          scheduled_posts = [e.get("node") or {} for e in scheduled_edges]
          if scheduled_posts and not dry_run:
              print("Scheduled post yang masih ada:")
              for post in scheduled_posts:
                  print(" -", post.get("id"), post.get("dueAt"))
              fail(
                  "Queue Buffer belum kosong. Tidak mengisi sesi baru untuk mencegah melebihi batas 10 atau duplikasi."
              )
          print(f"Buffer scheduled   : {len(scheduled_posts)}")

          # Summary of what would be scheduled.
          plan = []
          for slot in slots:
              asset = chosen[slot]
              due_wib = due_by_slot[slot]
              due_utc = due_wib.astimezone(UTC)
              plan.append((slot, asset, due_wib, due_utc))
              print(
                  f"PLAN Video{slot:02d} -> {due_wib.strftime('%Y-%m-%d %H:%M WIB')} "
                  f"({due_utc.isoformat().replace('+00:00','Z')})"
              )

          if dry_run:
              if quote_guard_active:
                  print(f"QUOTE GUARD OK — {len(quote_meta)} quote unik lolos.")
              print("\nDRY RUN BERHASIL — tidak ada post Buffer dibuat, history tidak diubah, dan tidak ada Cloudinary yang dihapus.")
              raise SystemExit(0)

          # Create scheduled TikTok posts. Caption intentionally empty; the quote/song are in MP4.
          created_posts = []
          for slot, asset, due_wib, due_utc in plan:
              video_url = asset["secure_url"]
              due_iso = due_utc.isoformat(timespec="milliseconds").replace("+00:00", "Z")
              # URLs from Cloudinary contain no quotes; json escaping here protects future changes.
              video_url_gql = json.dumps(video_url)
              channel_id_gql = json.dumps(channel_id)
              due_gql = json.dumps(due_iso)
              mutation = f'''
              mutation CreatePost {{
                createPost(
                  input: {{
                    text: ""
                    channelId: {channel_id_gql}
                    schedulingType: automatic
                    mode: customScheduled
                    dueAt: {due_gql}
                    assets: [
                      {{
                        video: {{
                          url: {video_url_gql}
                          metadata: {{ thumbnailOffset: 1000 }}
                        }}
                      }}
                    ]
                  }}
                ) {{
                  ... on PostActionSuccess {{
                    post {{ id dueAt status }}
                  }}
                  ... on MutationError {{ message }}
                }}
              }}
              '''
              result = buffer_graphql(mutation).get("createPost") or {}
              if result.get("message"):
                  fail(
                      f"Buffer menolak Video{slot:02d}: {result['message']}. "
                      f"Post sebelumnya pada sesi ini yang sudah dibuat: {created_posts}"
                  )
              post = result.get("post")
              if not post:
                  fail(
                      f"Respons Buffer Video{slot:02d} tidak berisi post. "
                      f"Post sebelumnya: {created_posts}"
                  )
              created_posts.append(post.get("id"))
              print(
                  f"BUFFER OK Video{slot:02d}: post={post.get('id')} dueAt={post.get('dueAt')} status={post.get('status')}"
              )

          print(f"\nSESI {session} BERHASIL: {len(created_posts)} post dijadwalkan ke TikTok wordavee.")

          if quote_guard_active:
              # Record only posts that Buffer actually accepted.
              for (slot, asset, due_wib, due_utc), post_id in zip(plan, created_posts):
                  meta = quote_meta[slot]
                  history["quotes"].append({
                      "text": meta["text"],
                      "normalized": meta["normalized"],
                      "hash": meta["hash"],
                      "date": target_day_str,
                      "slot": slot,
                      "buffer_post_id": post_id,
                      "cloudinary_public_id": asset.get("public_id"),
                      "saved_at": datetime.now(UTC).isoformat().replace("+00:00", "Z"),
                  })
              history["updated_at"] = datetime.now(UTC).isoformat().replace("+00:00", "Z")
              with open(history_file, "w", encoding="utf-8") as f:
                  json.dump(history, f, ensure_ascii=False, indent=2)
                  f.write("\n")
              print(f"Quote history      : +{len(created_posts)} quote -> {history_file}")

          # Add a compact Actions job summary.
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(f"## Wordivee session {session} berhasil\n\n")
                  f.write(f"Target tanggal WIB: **{target_day}**  \n")
                  f.write(f"Jumlah post: **{len(created_posts)}**  \n")
                  f.write(f"Quote guard: **{'aktif' if quote_guard_active else 'legacy'}**  \n\n")
                  f.write("| Video | Jadwal WIB | Buffer post ID |\n|---|---|---|\n")
                  for (slot, _, due_wib, _), post_id in zip(plan, created_posts):
                      f.write(f"| Video{slot:02d} | {due_wib.strftime('%Y-%m-%d %H:%M')} | `{post_id}` |\n")
          PY


      - name: Commit updated quote history
        if: ${{ success() }}
        shell: bash
        run: |
          if git diff --quiet -- quotes-history.json; then
            echo "Tidak ada perubahan quote history untuk run ini."
            exit 0
          fi
          git config user.name "wordivee-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes-history.json
          git commit -m "Update Wordivee quote history"
          git pull --rebase origin main
          git push origin HEAD:main
