name: Wordivee Buffer Resilient

on:
  workflow_dispatch:
    inputs:
      session:
        description: "Sesi: 1=01-10, 2=11-20, 3=21-24"
        required: true
        default: "auto"
        type: choice
        options: [auto, "1", "2", "3"]
      target_date:
        description: "Tanggal posting WIB (YYYY-MM-DD); kosong = hari ini"
        required: false
        default: ""
        type: string
      slots:
        description: "Opsional: slot dalam sesi, contoh 03,05"
        required: false
        default: ""
        type: string
      mode:
        description: "main atau recovery"
        required: true
        default: "main"
        type: choice
        options: [main, recovery]
      dry_run:
        description: "Tes baca saja; tidak membuat post atau mengubah state/history"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "30 0 * * *"
      timezone: "Asia/Jakarta"
    - cron: "30 10 * * *"
      timezone: "Asia/Jakarta"
    - cron: "30 20 * * *"
      timezone: "Asia/Jakarta"
    - cron: "45 0 * * *"
      timezone: "Asia/Jakarta"
    - cron: "45 10 * * *"
      timezone: "Asia/Jakarta"
    - cron: "45 20 * * *"
      timezone: "Asia/Jakarta"

permissions:
  contents: write

concurrency:
  group: wordivee-buffer-resilient
  cancel-in-progress: false

jobs:
  resilient-scheduler:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.WORDIVEE_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      EVENT_NAME: ${{ github.event_name }}
      SCHEDULE_EXPR: ${{ github.event.schedule }}
      INPUT_SESSION: ${{ inputs.session }}
      INPUT_TARGET_DATE: ${{ inputs.target_date }}
      INPUT_SLOTS: ${{ inputs.slots }}
      INPUT_MODE: ${{ inputs.mode }}
      EXPORT_ASSET_FOLDER: wordavee/exports
      MAX_EXPORT_AGE_HOURS: "30"
      QUOTE_GUARD_START_DATE: "2026-09-11"
      QUOTE_SIMILARITY_THRESHOLD: "0.94"
      QUOTE_HISTORY_FILE: quotes-history.json
      WORDIVEE_RETRY_DELAYS: "20,60,120"

    steps:
      - name: Checkout main with state history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Offline resilience tests
        run: python3 scripts/test_wordivee_resilient.py

      - name: Resolve dry-run mode
        id: mode
        shell: bash
        env:
          INPUT_DRY_RUN_VALUE: ${{ inputs.dry_run }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${INPUT_DRY_RUN_VALUE}" == "true" ]]; then
            echo "dry_arg=--dry-run" >> "$GITHUB_OUTPUT"
            echo "live=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry_arg=" >> "$GITHUB_OUTPUT"
            echo "live=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan and validate
        run: >-
          python3 scripts/wordivee_resilient.py
          --phase plan
          ${{ steps.mode.outputs.dry_arg }}

      - name: Persist planned intent before Buffer mutation
        if: ${{ steps.mode.outputs.live == 'true' }}
        shell: bash
        run: |
          if git diff --quiet -- state; then
            echo "Tidak ada state plan baru."
            exit 0
          fi
          git config user.name "wordivee-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git commit -m "Reserve Wordivee scheduling intent"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Execute missing slots with dedupe and recovery
        run: >-
          python3 scripts/wordivee_resilient.py
          --phase execute
          ${{ steps.mode.outputs.dry_arg }}

      - name: Persist final per-slot state and quote history
        if: ${{ always() && steps.mode.outputs.live == 'true' }}
        shell: bash
        run: |
          if git diff --quiet -- state quotes-history.json; then
            echo "Tidak ada perubahan final state/history."
            exit 0
          fi
          git config user.name "wordivee-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state quotes-history.json
          git commit -m "Update Wordivee resilient state"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Safe cleanup status
        if: ${{ always() }}
        run: |
          echo "Cloudinary cleanup: DITAHAN." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Aset wordavee/exports tidak dihapus sampai keterkaitan semua scheduled post dapat diverifikasi." | tee -a "$GITHUB_STEP_SUMMARY"
